<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaivi Search Engine</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Material Icons for UI -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <!-- Top Navigation Area -->
    <nav class="top-nav">
        <div class="nav-links">
            <a href="#">Gmail</a>
            <a href="#">Images</a>
        </div>
        <div class="nav-icons">
            <span class="material-symbols-outlined icon-btn">apps</span>
            <div class="profile-pic">
                <img src="https://ui-avatars.com/api/?name=Vaivi+User&background=random" alt="Profile">
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Logo / Name in the middle -->
        <div class="brand">
            <h1>Vaivi</h1>
            <p>Search Engine</p>
        </div>

        <!-- Search Tab / Bar -->
        <div class="search-container" id="search-container">
            <div class="search-box" id="search-box">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" id="search-input" placeholder="Ask Vaivi or type a URL" autocomplete="off">
                <span class="material-symbols-outlined action-icon">mic</span>
                <span class="material-symbols-outlined action-icon">lens</span>
            </div>

            <!-- Dropdown for Search Results -->
            <div class="search-dropdown" id="search-dropdown">
                <div class="dropdown-divider"></div>
                <ul id="results-list">
                    <!-- Javascript will inject results here -->
                </ul>
            </div>
        </div>

        <!-- Shortcuts Area -->
        <div class="shortcuts">
            <div class="shortcut">
                <div class="shortcut-icon"><span class="material-symbols-outlined">chat</span></div>
                <span class="shortcut-label">TEXT</span>
            </div>
            <div class="shortcut">
                <div class="shortcut-icon"><span class="material-symbols-outlined">music_note</span></div>
                <span class="shortcut-label">SPOTIFY</span>
            </div>
            <div class="shortcut">
                <div class="shortcut-icon"><span class="material-symbols-outlined">smart_display</span></div>
                <span class="shortcut-label">YT</span>
            </div>
            <div class="shortcut">
                <div class="shortcut-icon"><span class="material-symbols-outlined">smart_toy</span></div>
                <span class="shortcut-label">GPT</span>
            </div>
            <div class="shortcut">
                <div class="shortcut-icon add-icon"><span class="material-symbols-outlined">add</span></div>
                <span class="shortcut-label">Add shortcut</span>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
